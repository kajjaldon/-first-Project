<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>QR Studio — Create. Customize. Scan.</title>
  <!-- Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- QR & Barcode Libraries (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <!-- PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* ===== RESET & VARIABLES ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    :root {
      --bg-dark: #0b0e14;
      --bg-panel: rgba(18, 25, 40, 0.75);
      --glass-border: rgba(0, 255, 255, 0.15);
      --glass-glow: 0 0 20px rgba(0, 255, 255, 0.1);
      --accent-cyan: #00e0ff;
      --accent-purple: #b249f8;
      --accent-glow: linear-gradient(135deg, #00e0ff, #b249f8);
      --text-primary: #f0f4ff;
      --text-secondary: #a0b0d0;
      --card-radius: 24px;
      --btn-radius: 40px;
      --transition: all 0.25s ease;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      --error: #ff5c7a;
      --success: #2dd4bf;
    }

    body {
      background: var(--bg-dark);
      background-image: radial-gradient(circle at 10% 20%, rgba(0, 224, 255, 0.05) 0%, transparent 30%),
                        radial-gradient(circle at 90% 80%, rgba(178, 73, 248, 0.05) 0%, transparent 40%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* QR pattern overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.03"><path d="M10 10h10v10H10zM20 10h10v10H20zM30 10h10v10H30zM10 20h10v10H10zM30 20h10v10H30zM10 30h10v10H10zM20 30h10v10H20zM30 30h10v10H30z" fill="white"/></svg>');
      background-size: 120px 120px;
      pointer-events: none;
      z-index: 0;
    }

    /* ===== APP CONTAINER ===== */
    .app {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 1920px;
      margin: 0 auto;
      width: 100%;
    }

    /* ===== HEADER (mobile) ===== */
    .mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(10, 15, 25, 0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .mobile-header .logo {
      font-size: 1.6rem;
      font-weight: 700;
      background: var(--accent-glow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .menu-toggle {
      background: transparent;
      border: 1px solid var(--glass-border);
      color: white;
      font-size: 1.4rem;
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* ===== LAYOUT ===== */
    .main-layout {
      display: flex;
      flex: 1;
      gap: 24px;
      padding: 24px;
      max-width: 1920px;
      width: 100%;
      margin: 0 auto;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--card-radius);
      padding: 24px 16px;
      box-shadow: var(--shadow);
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sidebar-header .logo {
      font-size: 2rem;
      font-weight: 700;
      background: var(--accent-glow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .sidebar-header .tagline {
      font-size: 0.75rem;
      color: var(--text-secondary);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      padding: 10px 16px;
      gap: 8px;
    }

    .search-box i {
      color: var(--accent-cyan);
    }

    .search-box input {
      background: transparent;
      border: none;
      color: white;
      width: 100%;
      outline: none;
      font-size: 0.9rem;
    }

    .search-box input::placeholder {
      color: var(--text-secondary);
    }

    .nav-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      padding-left: 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 40px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .nav-item i {
      width: 20px;
      font-size: 1rem;
      color: var(--accent-cyan);
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(0, 224, 255, 0.08);
      border-color: rgba(0, 224, 255, 0.2);
      color: white;
      box-shadow: 0 0 15px rgba(0, 224, 255, 0.2);
    }

    .nav-item.active i {
      color: var(--accent-purple);
    }

    /* ===== MAIN CONTENT ===== */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-width: 0;
    }

    /* Dashboard Cards */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
    }

    .stat-card, .quick-card {
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--card-radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: var(--transition);
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .stat-card:hover, .quick-card:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 30px rgba(0, 224, 255, 0.15);
      transform: translateY(-2px);
    }

    .stat-card i, .quick-card i {
      font-size: 1.8rem;
      background: var(--accent-glow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      color: white;
    }

    .stat-card .label, .quick-card .label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Generator Panel */
    .generator-panel {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .form-card {
      flex: 2;
      min-width: 320px;
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--card-radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .preview-card {
      flex: 1;
      min-width: 300px;
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--card-radius);
      padding: 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      text-align: center;
    }

    .preview-card canvas, .preview-card svg, .preview-card img {
      max-width: 100%;
      height: auto;
      border-radius: 16px;
      background: white;
      padding: 12px;
    }

    .preview-card .qr-type-badge {
      background: rgba(0, 224, 255, 0.1);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 4px 16px;
      border-radius: 40px;
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .preview-card .data-preview {
      font-size: 0.8rem;
      color: var(--text-secondary);
      word-break: break-all;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 12px;
      width: 100%;
      max-height: 100px;
      overflow-y: auto;
      font-family: monospace;
    }

    .scan-safe {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--success);
    }

    .scan-safe.warning {
      color: #fbbf24;
    }

    /* Form elements */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 224, 255, 0.2);
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .form-row .form-group {
      flex: 1;
      min-width: 140px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
      background: transparent;
      color: white;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent-glow);
      border: none;
      color: #0b0e14;
      box-shadow: 0 0 20px rgba(0, 224, 255, 0.4);
    }

    .btn-primary:hover {
      box-shadow: 0 0 35px rgba(0, 224, 255, 0.7);
      transform: scale(1.02);
    }

    .btn-outline {
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.03);
    }

    .btn-outline:hover {
      border-color: var(--accent-cyan);
      background: rgba(0, 224, 255, 0.05);
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 0.75rem;
    }

    /* Customization panel */
    .customization-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .color-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-input-group input[type="color"] {
      width: 40px;
      height: 40px;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
      padding: 2px;
    }

    /* History items */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 300px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.2);
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
      font-size: 0.8rem;
    }

    .history-actions i {
      margin-left: 8px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: var(--transition);
    }

    .history-actions i:hover {
      color: var(--accent-cyan);
    }

    /* Error & warning */
    .error-msg {
      color: var(--error);
      font-size: 0.75rem;
      margin-top: 4px;
    }

    .warning-msg {
      color: #fbbf24;
      font-size: 0.75rem;
      background: rgba(251, 191, 36, 0.1);
      padding: 8px 12px;
      border-radius: 12px;
      margin-top: 8px;
      border-left: 3px solid #fbbf24;
    }

    .privacy-note {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-align: center;
      padding: 12px;
      opacity: 0.7;
    }

    /* Responsive */
    @media (max-width: 1100px) {
      .main-layout {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        max-height: none;
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        z-index: 200;
        border-radius: 0;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .mobile-header {
        display: flex;
      }
      .generator-panel {
        flex-direction: column;
      }
    }

    @media (max-width: 600px) {
      .main-layout {
        padding: 16px;
      }
      .form-card, .preview-card {
        padding: 20px;
      }
      .customization-panel {
        grid-template-columns: 1fr;
      }
      .btn-group .btn {
        flex: 1;
        padding: 12px 12px;
        font-size: 0.75rem;
      }
    }

    /* Utility */
    .hidden { display: none !important; }
    .flex { display: flex; }
    .gap-2 { gap: 8px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 16px; }
    .text-center { text-align: center; }
    .w-full { width: 100%; }
    .section-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 16px;
      background: var(--accent-glow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
<div class="app">
  <!-- Mobile header -->
  <header class="mobile-header">
    <div class="logo">QR Studio</div>
    <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
  </header>

  <div class="main-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">QR Studio</div>
        <div class="tagline">Create. Customize. Scan.</div>
      </div>

      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search generators...">
      </div>

      <nav class="nav-section" id="qrNav">
        <div class="nav-section-title">QR CODE</div>
        <!-- Filled by JS -->
      </nav>

      <nav class="nav-section" id="barcodeNav">
        <div class="nav-section-title">BARCODE</div>
        <!-- Filled by JS -->
      </nav>

      <div class="nav-section" id="extraNav">
        <div class="nav-section-title">TOOLS</div>
        <div class="nav-item" data-page="history"><i class="fas fa-history"></i> History</div>
        <div class="nav-item" data-page="favorites"><i class="fas fa-star"></i> Favorites</div>
        <div class="nav-item" data-page="dashboard"><i class="fas fa-th-large"></i> Dashboard</div>
      </div>

      <div class="privacy-note">🔒 Your QR data stays on this device.</div>
    </aside>

    <!-- Main content -->
    <main class="content-area" id="mainContent">
      <!-- Dashboard view (default) -->
      <div id="dashboardView">
        <h1 class="section-title">Dashboard</h1>
        <div class="dashboard-grid" id="statsGrid">
          <div class="stat-card"><i class="fas fa-qrcode"></i><div class="value" id="statQR">0</div><div class="label">QR Codes</div></div>
          <div class="stat-card"><i class="fas fa-barcode"></i><div class="value" id="statBarcode">0</div><div class="label">Barcodes</div></div>
          <div class="stat-card"><i class="fas fa-star"></i><div class="value" id="statFav">0</div><div class="label">Favorites</div></div>
        </div>
        <h2 class="section-title mt-3">Quick Create</h2>
        <div class="dashboard-grid">
          <div class="quick-card" data-page="text"><i class="fas fa-font"></i><div class="label">Text QR</div></div>
          <div class="quick-card" data-page="url"><i class="fas fa-link"></i><div class="label">URL QR</div></div>
          <div class="quick-card" data-page="upi-id"><i class="fas fa-rupee-sign"></i><div class="label">UPI QR</div></div>
          <div class="quick-card" data-page="phone"><i class="fas fa-phone"></i><div class="label">Phone QR</div></div>
          <div class="quick-card" data-page="wifi"><i class="fas fa-wifi"></i><div class="label">Wi-Fi QR</div></div>
          <div class="quick-card" data-page="vcard"><i class="fas fa-address-card"></i><div class="label">Contact QR</div></div>
          <div class="quick-card" data-page="barcode"><i class="fas fa-barcode"></i><div class="label">Barcode</div></div>
          <div class="quick-card" data-page="history"><i class="fas fa-history"></i><div class="label">History</div></div>
        </div>
      </div>

      <!-- Generator view (hidden by default) -->
      <div id="generatorView" class="hidden">
        <div class="generator-panel">
          <div class="form-card" id="formContainer">
            <!-- Dynamic form injected -->
          </div>
          <div class="preview-card" id="previewCard">
            <span class="qr-type-badge" id="previewType">TEXT</span>
            <div id="qrPreviewContainer">
              <canvas id="qrCanvas" width="200" height="200"></canvas>
              <svg id="barcodeSvg" class="hidden"></svg>
            </div>
            <div class="data-preview" id="dataPreview">—</div>
            <div class="scan-safe" id="scanSafe"><i class="fas fa-check-circle"></i> Scan-safe</div>
            <div class="btn-group w-full" id="actionButtons">
              <!-- Dynamic action buttons -->
            </div>
            <div class="customization-panel" id="customizationPanel">
              <!-- Customization controls -->
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
  // ============================================================
  // QR STUDIO — VANILLA JS APPLICATION
  // ============================================================
  (function() {
    "use strict";

    // ---------- STATE ----------
    const state = {
      currentPage: 'dashboard',
      currentType: 'text',
      qrData: '',
      qrTypeLabel: 'Text',
      history: [],
      favorites: [],
      stats: { qr: 0, barcode: 0 },
      customization: {
        fgColor: '#000000',
        bgColor: '#ffffff',
        eyeStyle: 'square',
        logo: null,
        ecc: 'M'
      }
    };

    // ---------- DOM REFS ----------
    const dom = {
      dashboardView: document.getElementById('dashboardView'),
      generatorView: document.getElementById('generatorView'),
      formContainer: document.getElementById('formContainer'),
      previewType: document.getElementById('previewType'),
      qrCanvas: document.getElementById('qrCanvas'),
      barcodeSvg: document.getElementById('barcodeSvg'),
      dataPreview: document.getElementById('dataPreview'),
      scanSafe: document.getElementById('scanSafe'),
      actionButtons: document.getElementById('actionButtons'),
      customizationPanel: document.getElementById('customizationPanel'),
      searchInput: document.getElementById('searchInput'),
      sidebar: document.getElementById('sidebar'),
      menuToggle: document.getElementById('menuToggle'),
      statQR: document.getElementById('statQR'),
      statBarcode: document.getElementById('statBarcode'),
      statFav: document.getElementById('statFav')
    };

    // ---------- NAVIGATION DATA ----------
    const qrPages = [
      { id: 'text', label: 'Text QR', icon: 'fa-font' },
      { id: 'url', label: 'URL / Website QR', icon: 'fa-link' },
      { id: 'upi-id', label: 'UPI Payment QR', icon: 'fa-rupee-sign' },
      { id: 'upi-number', label: 'UPI Number / Mobile', icon: 'fa-mobile-alt' },
      { id: 'phone', label: 'Phone Number QR', icon: 'fa-phone' },
      { id: 'number', label: 'Plain Number QR', icon: 'fa-hashtag' },
      { id: 'email', label: 'Email QR', icon: 'fa-envelope' },
      { id: 'sms', label: 'SMS QR', icon: 'fa-sms' },
      { id: 'whatsapp', label: 'WhatsApp QR', icon: 'fa-whatsapp' },
      { id: 'wifi', label: 'Wi-Fi QR', icon: 'fa-wifi' },
      { id: 'vcard', label: 'vCard / Contact QR', icon: 'fa-address-card' },
      { id: 'location', label: 'Location / Maps QR', icon: 'fa-map-marker-alt' },
      { id: 'event', label: 'Event QR', icon: 'fa-calendar-alt' },
      { id: 'social', label: 'Social Media QR', icon: 'fa-share-alt' },
      { id: 'crypto', label: 'Crypto Payment QR', icon: 'fa-bitcoin' },
      { id: 'deeplink', label: 'App Deep-Link QR', icon: 'fa-external-link-alt' },
      { id: 'custom', label: 'Custom QR', icon: 'fa-edit' }
    ];

    const barcodePages = [
      { id: 'barcode-code128', label: 'Code 128', icon: 'fa-barcode' },
      { id: 'barcode-code39', label: 'Code 39', icon: 'fa-barcode' },
      { id: 'barcode-ean13', label: 'EAN-13', icon: 'fa-barcode' },
      { id: 'barcode-ean8', label: 'EAN-8', icon: 'fa-barcode' },
      { id: 'barcode-upca', label: 'UPC-A', icon: 'fa-barcode' },
      { id: 'barcode-itf14', label: 'ITF-14', icon: 'fa-barcode' },
      { id: 'barcode-codabar', label: 'Codabar', icon: 'fa-barcode' },
      { id: 'barcode-isbn', label: 'ISBN Barcode', icon: 'fa-book' }
    ];

    // ---------- INIT ----------
    function init() {
      loadFromStorage();
      renderSidebar();
      renderDashboardStats();
      bindEvents();
      navigateTo('dashboard');
    }

    // ---------- STORAGE ----------
    function loadFromStorage() {
      try {
        const savedHistory = localStorage.getItem('qr_studio_history');
        if (savedHistory) state.history = JSON.parse(savedHistory);
        const savedFav = localStorage.getItem('qr_studio_favorites');
        if (savedFav) state.favorites = JSON.parse(savedFav);
        const savedStats = localStorage.getItem('qr_studio_stats');
        if (savedStats) state.stats = JSON.parse(savedStats);
      } catch(e) { console.warn('Storage error', e); }
    }

    function saveToStorage() {
      localStorage.setItem('qr_studio_history', JSON.stringify(state.history.slice(0, 50)));
      localStorage.setItem('qr_studio_favorites', JSON.stringify(state.favorites));
      localStorage.setItem('qr_studio_stats', JSON.stringify(state.stats));
    }

    // ---------- SIDEBAR RENDER ----------
    function renderSidebar() {
      const qrNav = document.getElementById('qrNav');
      const barcodeNav = document.getElementById('barcodeNav');
      
      qrNav.innerHTML = '<div class="nav-section-title">QR CODE</div>' + 
        qrPages.map(p => `<div class="nav-item" data-page="${p.id}"><i class="fas ${p.icon}"></i> ${p.label}</div>`).join('');
      
      barcodeNav.innerHTML = '<div class="nav-section-title">BARCODE</div>' + 
        barcodePages.map(p => `<div class="nav-item" data-page="${p.id}"><i class="fas ${p.icon}"></i> ${p.label}</div>`).join('');

      // Re-bind nav items
      document.querySelectorAll('.nav-item[data-page]').forEach(el => {
        el.addEventListener('click', () => navigateTo(el.dataset.page));
      });
    }

    // ---------- NAVIGATION ----------
    function navigateTo(page) {
      state.currentPage = page;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      if (page === 'dashboard' || page === 'history' || page === 'favorites') {
        dom.dashboardView.classList.remove('hidden');
        dom.generatorView.classList.add('hidden');
        if (page === 'history') renderHistoryView();
        else if (page === 'favorites') renderFavoritesView();
        else renderDashboardStats();
        return;
      }

      // Generator page
      dom.dashboardView.classList.add('hidden');
      dom.generatorView.classList.remove('hidden');

      const isBarcode = page.startsWith('barcode');
      if (isBarcode) {
        state.currentType = 'barcode';
        renderBarcodeForm(page);
      } else {
        state.currentType = page;
        renderQRForm(page);
      }
      
      // Update active nav
      const navEl = document.querySelector(`.nav-item[data-page="${page}"]`);
      if (navEl) navEl.classList.add('active');
      
      // Close mobile sidebar
      dom.sidebar.classList.remove('open');
    }

    // ---------- DASHBOARD ----------
    function renderDashboardStats() {
      dom.statQR.textContent = state.stats.qr || 0;
      dom.statBarcode.textContent = state.stats.barcode || 0;
      dom.statFav.textContent = state.favorites.length || 0;
    }

    // ---------- GENERATE QR ----------
    function generateQR(type) {
      let data = '';
      let previewText = '';
      let valid = true;

      try {
        switch(type) {
          case 'text':
            data = document.getElementById('inputText')?.value.trim() || '';
            previewText = data.substring(0, 60);
            break;
          case 'url':
            data = document.getElementById('inputUrl')?.value.trim() || '';
            if (!data || !/^https?:\/\/.+\..+/.test(data)) {
              document.getElementById('urlError')?.classList.remove('hidden');
              valid = false;
            } else {
              document.getElementById('urlError')?.classList.add('hidden');
            }
            previewText = data;
            break;
          case 'upi-id':
            const upiId = document.getElementById('upiId')?.value.trim() || '';
            const upiName = document.getElementById('upiName')?.value.trim() || '';
            const upiAmount = document.getElementById('upiAmount')?.value || '';
            const upiNote = document.getElementById('upiNote')?.value.trim() || '';
            if (!upiId) { alert('UPI ID is required'); valid = false; break; }
            data = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(upiName)}&am=${upiAmount}&cu=INR&tn=${encodeURIComponent(upiNote)}`;
            previewText = data;
            break;
          case 'upi-number':
            const upiNum = document.getElementById('upiNumber')?.value.trim() || '';
            const upiNumName = document.getElementById('upiNumName')?.value.trim() || '';
            const upiNumAmount = document.getElementById('upiNumAmount')?.value || '';
            const upiNumNote = document.getElementById('upiNumNote')?.value.trim() || '';
            if (!/^\d{10}$/.test(upiNum)) {
              document.getElementById('upiNumError')?.classList.remove('hidden');
              valid = false;
            } else {
              document.getElementById('upiNumError')?.classList.add('hidden');
            }
            // Safe UPI info QR — not a payment URI
            data = `UPI Number: ${upiNum}\nPayee: ${upiNumName}\nAmount: ₹${upiNumAmount}\nNote: ${upiNumNote}\n(Verify details before paying)`;
            previewText = data;
            break;
          case 'phone':
            const country = document.getElementById('phoneCountry')?.value.trim() || '+91';
            const phone = document.getElementById('phoneNumber')?.value.trim() || '';
            if (!/^\d{7,15}$/.test(phone)) {
              document.getElementById('phoneError')?.classList.remove('hidden');
              valid = false;
            } else {
              document.getElementById('phoneError')?.classList.add('hidden');
            }
            data = `tel:${country}${phone}`;
            previewText = data;
            break;
          case 'number':
            data = document.getElementById('plainNumber')?.value.trim() || '';
            previewText = data;
            break;
          case 'email':
            const email = document.getElementById('emailAddr')?.value.trim() || '';
            const subject = document.getElementById('emailSubject')?.value.trim() || '';
            const body = document.getElementById('emailBody')?.value.trim() || '';
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
              document.getElementById('emailError')?.classList.remove('hidden');
              valid = false;
            } else {
              document.getElementById('emailError')?.classList.add('hidden');
            }
            data = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            previewText = data;
            break;
          case 'sms':
            const smsNum = document.getElementById('smsNumber')?.value.trim() || '';
            const smsBody = document.getElementById('smsBody')?.value.trim() || '';
            data = `sms:${smsNum}?body=${encodeURIComponent(smsBody)}`;
            previewText = data;
            break;
          case 'whatsapp':
            const waNum = document.getElementById('waNumber')?.value.trim() || '';
            const waMsg = document.getElementById('waMessage')?.value.trim() || '';
            if (!waNum) { alert('WhatsApp number required'); valid = false; break; }
            data = `https://wa.me/${waNum}?text=${encodeURIComponent(waMsg)}`;
            previewText = data;
            break;
          case 'wifi':
            const ssid = document.getElementById('wifiSsid')?.value.trim() || '';
            const pass = document.getElementById('wifiPass')?.value.trim() || '';
            const sec = document.getElementById('wifiSecurity')?.value || 'WPA';
            const hidden = document.getElementById('wifiHidden')?.checked ? 'H:true;' : '';
            if (!ssid) { alert('SSID required'); valid = false; break; }
            data = `WIFI:T:${sec};S:${ssid};P:${pass};${hidden};`;
            previewText = data;
            break;
          case 'vcard':
            const vcName = document.getElementById('vcName')?.value.trim() || '';
            const vcPhone = document.getElementById('vcPhone')?.value.trim() || '';
            const vcEmail = document.getElementById('vcEmail')?.value.trim() || '';
            const vcOrg = document.getElementById('vcOrg')?.value.trim() || '';
            const vcTitle = document.getElementById('vcTitle')?.value.trim() || '';
            const vcWebsite = document.getElementById('vcWebsite')?.value.trim() || '';
            const vcAddress = document.getElementById('vcAddress')?.value.trim() || '';
            if (!vcName) { alert('Name required'); valid = false; break; }
            data = `BEGIN:VCARD\nVERSION:3.0\nFN:${vcName}\nTEL:${vcPhone}\nEMAIL:${vcEmail}\nORG:${vcOrg}\nTITLE:${vcTitle}\nURL:${vcWebsite}\nADR:${vcAddress}\nEND:VCARD`;
            previewText = data;
            break;
          case 'location':
            const lat = document.getElementById('locLat')?.value.trim() || '';
            const lng = document.getElementById('locLng')?.value.trim() || '';
            const locName = document.getElementById('locName')?.value.trim() || '';
            const locAddr = document.getElementById('locAddress')?.value.trim() || '';
            if (!lat || !lng) { alert('Latitude and longitude required'); valid = false; break; }
            data = `geo:${lat},${lng}?q=${lat},${lng}(${encodeURIComponent(locName || locAddr)})`;
            previewText = data;
            break;
          case 'event':
            const evName = document.getElementById('evName')?.value.trim() || '';
            const evDate = document.getElementById('evDate')?.value || '';
            const evStart = document.getElementById('evStart')?.value || '';
            const evEnd = document.getElementById('evEnd')?.value || '';
            const evLoc = document.getElementById('evLocation')?.value.trim() || '';
            const evDesc = document.getElementById('evDesc')?.value.trim() || '';
            if (!evName) { alert('Event name required'); valid = false; break; }
            const start = evDate.replace(/-/g, '') + 'T' + (evStart || '00:00').replace(/:/g, '') + '00';
            const end = evDate.replace(/-/g, '') + 'T' + (evEnd || '23:59').replace(/:/g, '') + '00';
            data = `BEGIN:VEVENT\nSUMMARY:${evName}\nDTSTART:${start}\nDTEND:${end}\nLOCATION:${evLoc}\nDESCRIPTION:${evDesc}\nEND:VEVENT`;
            previewText = data;
            break;
          case 'social':
            const socEntries = [];
            const insta = document.getElementById('socInsta')?.value.trim();
            const fb = document.getElementById('socFb')?.value.trim();
            const x = document.getElementById('socX')?.value.trim();
            const yt = document.getElementById('socYt')?.value.trim();
            const tg = document.getElementById('socTg')?.value.trim();
            const li = document.getElementById('socLi')?.value.trim();
            const web = document.getElementById('socWeb')?.value.trim();
            if (insta) socEntries.push(`Instagram: ${insta}`);
            if (fb) socEntries.push(`Facebook: ${fb}`);
            if (x) socEntries.push(`X: ${x}`);
            if (yt) socEntries.push(`YouTube: ${yt}`);
            if (tg) socEntries.push(`Telegram: ${tg}`);
            if (li) socEntries.push(`LinkedIn: ${li}`);
            if (web) socEntries.push(`Website: ${web}`);
            data = socEntries.join('\n');
            previewText = data;
            break;
          case 'crypto':
            const cryptoType = document.getElementById('cryptoType')?.value || 'bitcoin';
            const cryptoAddr = document.getElementById('cryptoAddr')?.value.trim() || '';
            const cryptoAmount = document.getElementById('cryptoAmount')?.value || '';
            const cryptoMsg = document.getElementById('cryptoMsg')?.value.trim() || '';
            if (!cryptoAddr) { alert('Wallet address required'); valid = false; break; }
            data = `${cryptoType}:${cryptoAddr}?amount=${cryptoAmount}&message=${encodeURIComponent(cryptoMsg)}`;
            previewText = data;
            break;
          case 'deeplink':
            data = document.getElementById('deepLink')?.value.trim() || '';
            previewText = data;
            break;
          case 'custom':
            data = document.getElementById('customData')?.value.trim() || '';
            previewText = data;
            break;
        }
      } catch(e) { valid = false; console.error(e); }

      if (!valid || !data) {
        if (valid && !data) alert('Please fill in the required fields.');
        return;
      }

      state.qrData = data;
      state.qrTypeLabel = qrPages.find(p => p.id === type)?.label || 'QR';
      
      // Render QR
      renderQRCode(data);
      
      // Update preview info
      dom.dataPreview.textContent = previewText || data;
      dom.scanSafe.className = 'scan-safe';
      dom.scanSafe.innerHTML = '<i class="fas fa-check-circle"></i> Scan-safe';

      // Update stats
      if (!type.startsWith('barcode')) {
        state.stats.qr = (state.stats.qr || 0) + 1;
      }
      saveToStorage();
      renderDashboardStats();

      // Add to history
      addToHistory(state.qrTypeLabel, previewText || data, data);

      // Render action buttons
      renderActionButtons();
    }

    // ---------- GENERATE BARCODE ----------
    function generateBarcode(format) {
      const input = document.getElementById('barcodeData')?.value.trim() || '';
      if (!input) { alert('Please enter data for the barcode.'); return; }

      // Validation
      let valid = true;
      if (format === 'ean13' && !/^\d{12,13}$/.test(input)) { alert('EAN-13 requires 12 or 13 digits.'); valid = false; }
      if (format === 'ean8' && !/^\d{7,8}$/.test(input)) { alert('EAN-8 requires 7 or 8 digits.'); valid = false; }
      if (format === 'upca' && !/^\d{11,12}$/.test(input)) { alert('UPC-A requires 11 or 12 digits.'); valid = false; }
      if (format === 'itf14' && !/^\d{14}$/.test(input)) { alert('ITF-14 requires exactly 14 digits.'); valid = false; }
      if (format === 'isbn' && !/^\d{10,13}$/.test(input)) { alert('ISBN requires 10 or 13 digits.'); valid = false; }
      if (!valid) return;

      state.qrData = input;
      state.qrTypeLabel = barcodePages.find(p => p.id === `barcode-${format}`)?.label || 'Barcode';

      // Hide QR, show barcode SVG
      dom.qrCanvas.classList.add('hidden');
      dom.barcodeSvg.classList.remove('hidden');

      try {
        JsBarcode(dom.barcodeSvg, input, {
          format: format.toUpperCase().replace('CODE39', 'CODE39').replace('CODE128', 'CODE128').replace('EAN13', 'EAN13').replace('EAN8', 'EAN8').replace('UPC', 'UPC').replace('ITF14', 'ITF14').replace('CODABAR', 'CODABAR').replace('ISBN', 'ISBN'),
          width: 2,
          height: 100,
          displayValue: true,
          background: '#ffffff',
          lineColor: '#000000'
        });
      } catch(e) {
        alert('Error generating barcode: ' + e.message);
        return;
      }

      dom.dataPreview.textContent = input;
      dom.scanSafe.className = 'scan-safe';
      dom.scanSafe.innerHTML = '<i class="fas fa-check-circle"></i> Scan-safe';

      state.stats.barcode = (state.stats.barcode || 0) + 1;
      saveToStorage();
      renderDashboardStats();

      addToHistory(state.qrTypeLabel, input, input);
      renderActionButtons();
    }

    // ---------- RENDER QR CODE ----------
    function renderQRCode(data) {
      dom.qrCanvas.classList.remove('hidden');
      dom.barcodeSvg.classList.add('hidden');
      
      const size = 240;
      const fg = state.customization.fgColor || '#000000';
      const bg = state.customization.bgColor || '#ffffff';

      QRCode.toCanvas(dom.qrCanvas, data, {
        width: size,
        margin: 2,
        color: {
          dark: fg,
          light: bg
        },
        errorCorrectionLevel: state.customization.ecc || 'M'
      }, function(error) {
        if (error) console.error(error);
      });
    }

    // ---------- CUSTOMIZATION PANEL ----------
    function renderCustomizationPanel() {
      const panel = dom.customizationPanel;
      panel.innerHTML = `
        <div class="form-group">
          <label>Foreground</label>
          <div class="color-input-group">
            <input type="color" id="fgColor" value="${state.customization.fgColor}">
            <input type="text" id="fgColorText" value="${state.customization.fgColor}" style="flex:1;padding:8px;border-radius:12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);color:white;">
          </div>
        </div>
        <div class="form-group">
          <label>Background</label>
          <div class="color-input-group">
            <input type="color" id="bgColor" value="${state.customization.bgColor}">
            <input type="text" id="bgColorText" value="${state.customization.bgColor}" style="flex:1;padding:8px;border-radius:12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);color:white;">
          </div>
        </div>
        <div class="form-group">
          <label>Eye Style</label>
          <select id="eyeStyle">
            <option value="square" ${state.customization.eyeStyle === 'square' ? 'selected' : ''}>Square</option>
            <option value="rounded" ${state.customization.eyeStyle === 'rounded' ? 'selected' : ''}>Rounded</option>
            <option value="circle" ${state.customization.eyeStyle === 'circle' ? 'selected' : ''}>Circle</option>
          </select>
        </div>
        <div class="form-group">
          <label>Error Correction</label>
          <select id="eccLevel">
            <option value="L" ${state.customization.ecc === 'L' ? 'selected' : ''}>Low</option>
            <option value="M" ${state.customization.ecc === 'M' ? 'selected' : ''}>Medium</option>
            <option value="Q" ${state.customization.ecc === 'Q' ? 'selected' : ''}>Quartile</option>
            <option value="H" ${state.customization.ecc === 'H' ? 'selected' : ''}>High</option>
          </select>
        </div>
        <div class="form-group">
          <label>Logo</label>
          <input type="file" id="logoUpload" accept="image/*" style="padding:8px;background:rgba(0,0,0,0.3);border-radius:12px;border:1px solid rgba(255,255,255,0.1);color:white;width:100%;">
          <button class="btn btn-outline btn-sm mt-2" id="removeLogoBtn" style="width:100%;">Remove Logo</button>
        </div>
      `;

      // Bind color inputs
      document.getElementById('fgColor')?.addEventListener('input', (e) => {
        state.customization.fgColor = e.target.value;
        document.getElementById('fgColorText').value = e.target.value;
        if (state.qrData) renderQRCode(state.qrData);
      });
      document.getElementById('fgColorText')?.addEventListener('input', (e) => {
        state.customization.fgColor = e.target.value;
        document.getElementById('fgColor').value = e.target.value;
        if (state.qrData) renderQRCode(state.qrData);
      });
      document.getElementById('bgColor')?.addEventListener('input', (e) => {
        state.customization.bgColor = e.target.value;
        document.getElementById('bgColorText').value = e.target.value;
        if (state.qrData) renderQRCode(state.qrData);
      });
      document.getElementById('bgColorText')?.addEventListener('input', (e) => {
        state.customization.bgColor = e.target.value;
        document.getElementById('bgColor').value = e.target.value;
        if (state.qrData) renderQRCode(state.qrData);
      });
      document.getElementById('eyeStyle')?.addEventListener('change', (e) => {
        state.customization.eyeStyle = e.target.value;
      });
      document.getElementById('eccLevel')?.addEventListener('change', (e) => {
        state.customization.ecc = e.target.value;
        if (state.qrData) renderQRCode(state.qrData);
      });
      document.getElementById('logoUpload')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            state.customization.logo = ev.target.result;
            if (state.qrData) renderQRCode(state.qrData);
          };
          reader.readAsDataURL(file);
        }
      });
      document.getElementById('removeLogoBtn')?.addEventListener('click', () => {
        state.customization.logo = null;
        if (state.qrData) renderQRCode(state.qrData);
      });
    }

    // ---------- ACTION BUTTONS ----------
    function renderActionButtons() {
      const container = dom.actionButtons;
      container.innerHTML = `
        <button class="btn btn-outline btn-sm" id="copyBtn"><i class="fas fa-copy"></i> Copy</button>
        <button class="btn btn-outline btn-sm" id="testBtn"><i class="fas fa-vial"></i> Test</button>
        <button class="btn btn-outline btn-sm" id="downloadPngBtn"><i class="fas fa-download"></i> PNG</button>
        <button class="btn btn-outline btn-sm" id="downloadSvgBtn"><i class="fas fa-download"></i> SVG</button>
        <button class="btn btn-outline btn-sm" id="downloadPdfBtn"><i class="fas fa-file-pdf"></i> PDF</button>
        <button class="btn btn-outline btn-sm" id="printBtn"><i class="fas fa-print"></i> Print</button>
        <button class="btn btn-outline btn-sm" id="shareBtn"><i class="fas fa-share"></i> Share</button>
        <button class="btn btn-outline btn-sm" id="favBtn"><i class="fas fa-star"></i> Fav</button>
      `;

      document.getElementById('copyBtn')?.addEventListener('click', () => {
        if (!state.qrData) return alert('Generate a QR first.');
        navigator.clipboard.writeText(state.qrData).then(() => alert('Data copied!')).catch(() => alert('Copy failed.'));
      });

      document.getElementById('testBtn')?.addEventListener('click', () => {
        if (!state.qrData) return alert('Generate a QR first.');
        alert('Encoded data:\n\n' + state.qrData + '\n\nTest the QR before sharing it.');
      });

      document.getElementById('downloadPngBtn')?.addEventListener('click', downloadPNG);
      document.getElementById('downloadSvgBtn')?.addEventListener('click', downloadSVG);
      document.getElementById('downloadPdfBtn')?.addEventListener('click', downloadPDF);
      document.getElementById('printBtn')?.addEventListener('click', printQR);
      document.getElementById('shareBtn')?.addEventListener('click', shareQR);

      document.getElementById('favBtn')?.addEventListener('click', () => {
        if (!state.qrData) return alert('Generate a QR first.');
        const exists = state.favorites.some(f => f.data === state.qrData);
        if (exists) { alert('Already in favorites!'); return; }
        state.favorites.push({
          type: state.qrTypeLabel,
          preview: state.qrData.substring(0, 60),
          data: state.qrData,
          date: new Date().toLocaleString()
        });
        saveToStorage();
        renderDashboardStats();
        alert('Added to favorites!');
      });
    }

    // ---------- DOWNLOAD FUNCTIONS ----------
    function downloadPNG() {
      if (!state.qrData) return alert('Generate a QR first.');
      const canvas = dom.qrCanvas;
      const link = document.createElement('a');
      link.download = 'qr-studio-' + Date.now() + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function downloadSVG() {
      if (!state.qrData) return alert('Generate a QR first.');
      // Generate SVG via QRCode library
      QRCode.toString(state.qrData, { type: 'svg', margin: 2 }, (err, svg) => {
        if (err) return alert('Error generating SVG');
        const blob = new Blob([svg], { type: 'image/svg+xml' });
        const link = document.createElement('a');
        link.download = 'qr-studio-' + Date.now() + '.svg';
        link.href = URL.createObjectURL(blob);
        link.click();
      });
    }

    function downloadPDF() {
      if (!state.qrData) return alert('Generate a QR first.');
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const canvas = dom.qrCanvas;
      const imgData = canvas.toDataURL('image/png');
      doc.setFontSize(16);
      doc.text('QR Studio — ' + state.qrTypeLabel, 14, 20);
      doc.addImage(imgData, 'PNG', 14, 30, 100, 100);
      doc.setFontSize(10);
      doc.text('Data: ' + state.qrData.substring(0, 100), 14, 140);
      doc.save('qr-studio-' + Date.now() + '.pdf');
    }

    function printQR() {
      if (!state.qrData) return alert('Generate a QR first.');
      const canvas = dom.qrCanvas;
      const dataUrl = canvas.toDataURL('image/png');
      const win = window.open('', '_blank');
      win.document.write('<html><head><title>Print QR</title></head><body style="text-align:center;padding:20px;"><h2>' + state.qrTypeLabel + '</h2><img src="' + dataUrl + '" style="max-width:400px;"><p>' + state.qrData.substring(0, 200) + '</p></body></html>');
      win.document.close();
      win.print();
    }

    function shareQR() {
      if (!state.qrData) return alert('Generate a QR first.');
      if (navigator.share) {
        navigator.share({ title: 'QR Studio — ' + state.qrTypeLabel, text: state.qrData });
      } else {
        alert('Sharing not supported. Copy data manually:\n\n' + state.qrData);
      }
    }

    // ---------- HISTORY ----------
    function addToHistory(type, preview, data) {
      state.history.unshift({
        type: type,
        preview: preview,
        data: data,
        date: new Date().toLocaleString()
      });
      state.history = state.history.slice(0, 50);
      saveToStorage();
    }

    window._reopenHistory = function(index) {
      const item = state.history[index];
      if (!item) return;
      alert('Reopening: ' + item.type + '\n\nData: ' + item.data);
    };

    window._duplicateHistory = function(index) {
      const item = state.history[index];
      if (!item) return;
      state.history.unshift({ ...item, date: new Date().toLocaleString() });
      saveToStorage();
      renderHistoryView();
    };

    window._deleteHistory = function(index) {
      state.history.splice(index, 1);
      saveToStorage();
      renderHistoryView();
    };

    window._clearHistory = function() {
      if (confirm('Clear all history?')) {
        state.history = [];
        saveToStorage();
        renderHistoryView();
      }
    };

    window._deleteFavorite = function(index) {
      state.favorites.splice(index, 1);
      saveToStorage();
      renderFavoritesView();
      renderDashboardStats();
    };

    // ---------- SEARCH ----------
    dom.searchInput?.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      document.querySelectorAll('.nav-item[data-page]').forEach(el => {
        const text = el.textContent.toLowerCase();
        el.style.display = text.includes(query) ? 'flex' : 'none';
      });
    });

    // ---------- MOBILE MENU ----------
    dom.menuToggle?.addEventListener('click', () => {
      dom.sidebar.classList.toggle('open');
    });

    // ---------- CLEAR PREVIEW ----------
    function clearQRPreview() {
      dom.dataPreview.textContent = '—';
      dom.scanSafe.className = 'scan-safe';
      dom.scanSafe.innerHTML = '<i class="fas fa-check-circle"></i> Scan-safe';
      dom.actionButtons.innerHTML = '';
      state.qrData = '';
    }

    // ---------- BIND EVENTS ----------
    function bindEvents() {
      // Sidebar quick nav
      document.querySelectorAll('.quick-card[data-page]').forEach(el => {
        el.addEventListener('click', () => navigateTo(el.dataset.page));
      });
    }

    // ---------- EXPOSE FOR INLINE HANDLERS ----------
    window._reopenHistory = window._reopenHistory || function(){};
    window._duplicateHistory = window._duplicateHistory || function(){};
    window._deleteHistory = window._deleteHistory || function(){};
    window._clearHistory = window._clearHistory || function(){};
    window._deleteFavorite = window._deleteFavorite || function(){};

    // ---------- START ----------
    init();

  })();
</script>
</body>
</html>
